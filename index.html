<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Lighthouse — a living coastal scene that changes with your real local time." />
  <meta name="color-scheme" content="dark light" />
  <title>The Lighthouse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" aria-label="A lighthouse scene that changes with the real local time of day">
    <div class="wall" aria-hidden="true"></div>

    <div class="composition">
      <!-- UI overlay -->
      <header class="ui" aria-label="Time information">
        <p class="eyebrow">The Lighthouse</p>
        <div class="ui-row">
          <time id="clock" class="clock" datetime="">--:--</time>
          <span id="phaseLabel" class="phase" aria-live="polite">…</span>
        </div>
        <p id="phaseDesc" class="desc" aria-live="polite">Listening to the water…</p>
      </header>

      <!-- The scene -->
      <section class="window-wrap" aria-label="Coastal lighthouse scene showing sky, sea, beam and ship according to local time">
        <div class="window" id="window" role="img" aria-label="Illustrated lighthouse that reflects the current time of day">
          <div class="view" aria-hidden="true">
            <div class="sky"></div>
            <div class="stars" id="stars"></div>
            <div class="sun" id="sun"></div>
            <div class="moon" id="moon"></div>

            <div class="clouds">
              <div class="cloud c1"></div>
              <div class="cloud c2"></div>
              <div class="cloud c3"></div>
              <div class="cloud c4"></div>
            </div>

            <div class="gulls" id="birds" aria-hidden="true">
              <span class="bird b1"></span>
              <span class="bird b2"></span>
              <span class="bird b3"></span>
              <span class="bird b4"></span>
              <span class="bird b5"></span>
            </div>

            <div class="sea"></div>
            <div class="sea-shimmer"></div>
            <div class="beam-reflection"></div>

            <div class="headland"></div>

            <div class="lighthouse">
              <span class="dome"></span>
              <span class="lamp-room"><span class="lamp-glass"></span></span>
              <span class="gallery"></span>
              <span class="tower"><span class="tower-win"></span></span>
              <span class="door"></span>
            </div>
            <div class="beam"></div>

            <div class="ship" aria-hidden="true">
              <span class="hull"></span>
              <span class="cabin"></span>
              <span class="mast"></span>
            </div>

            <div class="rocks-fg"></div>
            <div class="mist"></div>

            <div class="warm-wash"></div>
            <div class="night-dim"></div>
            <div class="glare"></div>
          </div>
        </div>

        <div class="caption" aria-hidden="true">
          <span class="keeper"></span>
          <p>Keeper's note — the lamp wakes ~6:30 PM. Watch for the passing ship.</p>
        </div>
      </section>

      <!-- Timeline indicator -->
      <footer class="timeline" aria-label="Time of day progress">
        <div class="timeline-track" aria-hidden="true">
          <div class="timeline-gradient"></div>
          <div class="timeline-marker" id="timelineMarker"></div>
        </div>
        <div class="timeline-labels" aria-hidden="true">
          <span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span>
        </div>
        <p class="hint">Live — driven by your device clock. First light + passing ship ~6:30–7 PM.</p>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
